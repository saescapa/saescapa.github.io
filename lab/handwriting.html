<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Handwriting probe</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 48px;
    background: #f3f1eb;
    color: #1a1a1a;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 14px;
    line-height: 1.5;
  }
  main { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  h2 { font-size: 15px; margin: 28px 0 8px; text-transform: uppercase; letter-spacing: 0.05em; }
  dl { margin: 0; }
  dt { font-weight: bold; }
  dd { margin: 0 0 6px; overflow-wrap: anywhere; }
  .row { display: flex; gap: 8px; align-items: baseline; padding: 6px 0; border-bottom: 1px solid #d8d4c8; }
  .row .name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .row .detail { display: block; color: #555; font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .pill { flex: none; padding: 0 8px; border: 1px solid #1a1a1a; border-radius: 999px; font-size: 12px; }
  .pill.available { background: #1a1a1a; color: #f3f1eb; }
  .pill.missing { background: transparent; }
  .pill.error { background: #b3261e; border-color: #b3261e; color: #fff; }
  canvas {
    display: block;
    width: 100%;
    height: 220px;
    background: #fff;
    border: 1px solid #1a1a1a;
    touch-action: none;
  }
  .buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  button {
    font: inherit;
    padding: 8px 14px;
    background: #1a1a1a;
    color: #f3f1eb;
    border: 1px solid #1a1a1a;
    border-radius: 4px;
    cursor: pointer;
  }
  button.secondary { background: transparent; color: #1a1a1a; }
  ul { margin: 0; padding: 0; list-style: none; }
  #results li { padding: 6px 0; border-bottom: 1px solid #d8d4c8; white-space: pre-wrap; overflow-wrap: anywhere; }
  textarea {
    display: block;
    width: 100%;
    height: 260px;
    font: inherit;
    font-size: 12px;
    background: #fff;
    color: #1a1a1a;
    border: 1px solid #1a1a1a;
    padding: 8px;
  }
  #copyStatus { margin-top: 8px; min-height: 1.5em; }
</style>
</head>
<body>
<main>
  <h1>Handwriting probe</h1>

  <h2>Environment</h2>
  <dl id="environment"></dl>

  <h2>Capabilities</h2>
  <div id="capabilities"></div>

  <h2>Draw pad</h2>
  <canvas id="pad"></canvas>
  <div class="buttons">
    <button id="recognize" type="button">Recognize</button>
    <button id="clear" type="button" class="secondary">Clear</button>
    <button id="copy" type="button" class="secondary">Copy report</button>
  </div>

  <h2>Recognition</h2>
  <ul id="results"><li>No recognition run yet.</li></ul>

  <h2>Report</h2>
  <textarea id="report" readonly></textarea>
  <div id="copyStatus" role="status"></div>
</main>
<script type="module">
const GREETING_REPLIES = new Map([
  ['hi', 'hello!'],
  ['hey', 'hello!'],
  ['hello', 'hi!'],
]);

const log = [];
const capabilityRows = [];
const environmentLines = [];
const strokes = [];
let drawingStart = null;
let activeStroke = null;
let handwritingRecognizer = null;
let textDetector = null;

const elements = {
  environment: document.getElementById('environment'),
  capabilities: document.getElementById('capabilities'),
  pad: document.getElementById('pad'),
  recognize: document.getElementById('recognize'),
  clear: document.getElementById('clear'),
  copy: document.getElementById('copy'),
  results: document.getElementById('results'),
  report: document.getElementById('report'),
  copyStatus: document.getElementById('copyStatus'),
};

const describeError = (error) =>
  error instanceof Error ? `${error.name}: ${error.message}` : `thrown: ${String(error)}`;

const toJSON = (value) => {
  try {
    return JSON.stringify(value);
  } catch (error) {
    return `unserializable (${describeError(error)})`;
  }
};

const buildReport = () => [
  'HANDWRITING PROBE REPORT',
  '',
  '== Environment ==',
  ...environmentLines.map(([label, value]) => `${label}: ${value}`),
  '',
  '== Capabilities ==',
  ...capabilityRows.map((row) => `[${row.status}] ${row.name}: ${row.detail}`),
  '',
  '== Log ==',
  ...log,
].join('\n');

const render = () => {
  elements.environment.replaceChildren(
    ...environmentLines.flatMap(([label, value]) => {
      const dt = document.createElement('dt');
      dt.textContent = label;
      const dd = document.createElement('dd');
      dd.textContent = value;
      return [dt, dd];
    }),
  );
  elements.capabilities.replaceChildren(
    ...capabilityRows.map((row) => {
      const container = document.createElement('div');
      container.className = 'row';
      const name = document.createElement('div');
      name.className = 'name';
      name.textContent = row.name;
      const detail = document.createElement('span');
      detail.className = 'detail';
      detail.textContent = row.detail;
      name.append(detail);
      const pill = document.createElement('span');
      pill.className = `pill ${row.status}`;
      pill.textContent = row.status;
      container.append(name, pill);
      return container;
    }),
  );
  elements.report.value = buildReport();
};

const addLog = (line) => {
  log.push(`${new Date().toISOString()} ${line}`);
  render();
};

const addCapability = (name, status, detail) => {
  capabilityRows.push({ name, status, detail });
  addLog(`capability ${name} [${status}] ${detail}`);
};

const addEnvironment = (label, read) => {
  try {
    environmentLines.push([label, String(read())]);
  } catch (error) {
    environmentLines.push([label, `error ${describeError(error)}`]);
  }
};

const collectEnvironment = () => {
  addEnvironment('userAgent', () => navigator.userAgent);
  addEnvironment('userAgentData.platform', () =>
    navigator.userAgentData ? navigator.userAgentData.platform : 'n/a',
  );
  addEnvironment('isSecureContext', () => window.isSecureContext);
  addEnvironment('top-level', () => window.top === window);
  addEnvironment('devicePixelRatio', () => window.devicePixelRatio);
  addEnvironment('PointerEvent', () => 'PointerEvent' in window);
  render();
};

const probeHandwriting = async () => {
  const hasQuery = 'queryHandwritingRecognizer' in navigator;
  const hasCreate = 'createHandwritingRecognizer' in navigator;
  const hasStroke = 'HandwritingStroke' in window;
  addCapability(
    'Handwriting Recognition API',
    hasQuery && hasCreate && hasStroke ? 'available' : 'missing',
    `queryHandwritingRecognizer=${hasQuery} createHandwritingRecognizer=${hasCreate} HandwritingStroke=${hasStroke}`,
  );

  if (hasQuery) {
    try {
      const queryResult = await navigator.queryHandwritingRecognizer({ languages: ['en'] });
      addCapability(
        'queryHandwritingRecognizer({ languages: ["en"] })',
        queryResult ? 'available' : 'missing',
        queryResult ? toJSON(queryResult) : 'null',
      );
    } catch (error) {
      addCapability('queryHandwritingRecognizer({ languages: ["en"] })', 'error', describeError(error));
    }
  } else {
    addCapability('queryHandwritingRecognizer({ languages: ["en"] })', 'missing', 'not in navigator');
  }

  if (hasCreate) {
    try {
      handwritingRecognizer = await navigator.createHandwritingRecognizer({ languages: ['en'] });
      addCapability('createHandwritingRecognizer({ languages: ["en"] })', 'available', 'created');
    } catch (error) {
      addCapability('createHandwritingRecognizer({ languages: ["en"] })', 'error', describeError(error));
    }
  } else {
    addCapability('createHandwritingRecognizer({ languages: ["en"] })', 'missing', 'not in navigator');
  }
};

const probeTextDetector = () => {
  const hasTextDetector = 'TextDetector' in window;
  addCapability('TextDetector', hasTextDetector ? 'available' : 'missing', `'TextDetector' in window=${hasTextDetector}`);
  if (!hasTextDetector) {
    addCapability('new TextDetector()', 'missing', 'not in window');
    return;
  }
  try {
    textDetector = new window.TextDetector();
    addCapability('new TextDetector()', 'available', 'ok');
  } catch (error) {
    addCapability('new TextDetector()', 'error', describeError(error));
  }
  try {
    addCapability(
      'TextDetector.getSupportedFormats',
      typeof window.TextDetector.getSupportedFormats === 'function' ? 'available' : 'missing',
      `typeof=${typeof window.TextDetector.getSupportedFormats}`,
    );
  } catch (error) {
    addCapability('TextDetector.getSupportedFormats', 'error', describeError(error));
  }
};

const runCapabilityStep = async (label, step) => {
  try {
    await step();
  } catch (error) {
    addCapability(label, 'error', describeError(error));
  }
};

const pad = elements.pad;
const context = pad.getContext('2d');

const redraw = () => {
  const dpr = window.devicePixelRatio || 1;
  context.setTransform(dpr, 0, 0, dpr, 0, 0);
  context.fillStyle = '#fff';
  context.fillRect(0, 0, pad.clientWidth, pad.clientHeight);
  context.strokeStyle = '#000';
  context.fillStyle = '#000';
  context.lineWidth = 4;
  context.lineCap = 'round';
  context.lineJoin = 'round';
  for (const stroke of strokes) {
    if (stroke.length === 1) {
      context.beginPath();
      context.arc(stroke[0].x, stroke[0].y, 2, 0, Math.PI * 2);
      context.fill();
      continue;
    }
    context.beginPath();
    context.moveTo(stroke[0].x, stroke[0].y);
    for (const point of stroke.slice(1)) context.lineTo(point.x, point.y);
    context.stroke();
  }
};

const resizePad = () => {
  const dpr = window.devicePixelRatio || 1;
  pad.width = Math.round(pad.clientWidth * dpr);
  pad.height = Math.round(pad.clientHeight * dpr);
  redraw();
};

const pointFromEvent = (event) => {
  const rect = pad.getBoundingClientRect();
  const now = performance.now();
  if (drawingStart === null) drawingStart = now;
  return { x: event.clientX - rect.left, y: event.clientY - rect.top, t: Math.round(now - drawingStart) };
};

pad.addEventListener('pointerdown', (event) => {
  event.preventDefault();
  pad.setPointerCapture(event.pointerId);
  activeStroke = [pointFromEvent(event)];
  strokes.push(activeStroke);
  redraw();
});

pad.addEventListener('pointermove', (event) => {
  if (!activeStroke) return;
  event.preventDefault();
  activeStroke.push(pointFromEvent(event));
  redraw();
});

const endStroke = (event) => {
  if (!activeStroke) return;
  if (pad.hasPointerCapture(event.pointerId)) pad.releasePointerCapture(event.pointerId);
  activeStroke = null;
};

pad.addEventListener('pointerup', endStroke);
pad.addEventListener('pointercancel', endStroke);

elements.clear.addEventListener('click', () => {
  strokes.length = 0;
  activeStroke = null;
  drawingStart = null;
  redraw();
});

window.addEventListener('resize', resizePad);

const timed = async (task) => {
  const started = performance.now();
  try {
    const value = await task();
    return { ok: true, value, ms: performance.now() - started };
  } catch (error) {
    return { ok: false, error, ms: performance.now() - started };
  }
};

const recognizeHandwriting = async () => {
  if (!handwritingRecognizer) throw new Error('no handwriting recognizer');
  let drawing;
  try {
    drawing = handwritingRecognizer.startDrawing({ recognitionType: 'text' });
  } catch (hintError) {
    drawing = handwritingRecognizer.startDrawing();
  }
  try {
    for (const points of strokes) {
      const stroke = new window.HandwritingStroke();
      for (const { x, y, t } of points) stroke.addPoint({ x, y, t });
      drawing.addStroke(stroke);
    }
    const predictions = await drawing.getPrediction();
    return predictions.map((prediction) => prediction.text);
  } finally {
    drawing.clear();
  }
};

const detectText = async () => {
  if (!textDetector) throw new Error('no text detector');
  let detections;
  try {
    detections = await textDetector.detect(pad);
  } catch (canvasError) {
    detections = await textDetector.detect(await createImageBitmap(pad));
  }
  return detections.map((detection) => ({
    text: detection.rawValue,
    box: detection.boundingBox
      ? [detection.boundingBox.x, detection.boundingBox.y, detection.boundingBox.width, detection.boundingBox.height].map(Math.round)
      : null,
  }));
};

const normalize = (text) =>
  text.trim().toLowerCase().replace(/[^\p{L}\p{N}\s]/gu, '').trim();

const greetingFor = (topText) => {
  const reply = GREETING_REPLIES.get(normalize(topText ?? ''));
  return reply ? `would reply: ${reply}` : 'no greeting match';
};

const recognizers = [
  {
    name: 'Handwriting',
    run: recognizeHandwriting,
    available: () => handwritingRecognizer !== null,
    summarize: (texts) => ({
      top: texts[0],
      line: texts.length ? `predictions: ${texts.map((text) => JSON.stringify(text)).join(', ')}` : 'no predictions',
    }),
  },
  {
    name: 'TextDetector',
    run: detectText,
    available: () => textDetector !== null,
    summarize: (detections) => ({
      top: detections[0]?.text,
      line: detections.length
        ? detections.map((d) => `${JSON.stringify(d.text)} box=${toJSON(d.box)}`).join('; ')
        : 'no text detected',
    }),
  },
];

const showResults = (lines) => {
  elements.results.replaceChildren(
    ...lines.map((line) => {
      const item = document.createElement('li');
      item.textContent = line;
      return item;
    }),
  );
};

const recognize = async () => {
  elements.recognize.disabled = true;
  try {
    if (strokes.length === 0) {
      showResults(['Draw something first.']);
      addLog('recognize skipped: empty drawing');
      return;
    }
    const active = recognizers.filter((recognizer) => recognizer.available());
    for (const recognizer of recognizers) {
      if (!active.includes(recognizer)) addLog(`recognize ${recognizer.name}: unavailable`);
    }
    if (active.length === 0) {
      showResults(['No recognizer available.']);
      return;
    }
    const outcomes = await Promise.all(active.map(async (recognizer) => ({ recognizer, outcome: await timed(recognizer.run) })));
    const lines = outcomes.map(({ recognizer, outcome }) => {
      const ms = `${outcome.ms.toFixed(1)} ms`;
      if (!outcome.ok) return `${recognizer.name}: error ${describeError(outcome.error)} (${ms})`;
      const { top, line } = recognizer.summarize(outcome.value);
      return `${recognizer.name}: ${line} (${ms})\n  hi test: ${greetingFor(top)}`;
    });
    for (const line of lines) addLog(`recognize ${line.replace(/\n\s*/g, ' | ')}`);
    showResults(lines);
  } catch (error) {
    addLog(`recognize failed ${describeError(error)}`);
    showResults([`recognize failed ${describeError(error)}`]);
  } finally {
    elements.recognize.disabled = false;
  }
};

elements.recognize.addEventListener('click', recognize);

elements.copy.addEventListener('click', async () => {
  render();
  const report = elements.report.value;
  try {
    await navigator.clipboard.writeText(report);
    elements.copyStatus.textContent = 'Report copied.';
  } catch (error) {
    elements.report.focus();
    elements.report.select();
    elements.copyStatus.textContent = `Clipboard failed (${describeError(error)}) - copy manually.`;
  }
});

collectEnvironment();
resizePad();
await runCapabilityStep('Handwriting Recognition API', probeHandwriting);
await runCapabilityStep('TextDetector', probeTextDetector);
</script>
</body>
</html>
